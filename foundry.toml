[profile.default]
src = "smart-contracts"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.19"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
additional_compiler_profiles = [
    { name = "governance-via-ir", via_ir = true, optimizer = true, optimizer_runs = 200, evm_version = "paris", bytecode_hash = "None" },
]
compilation_restrictions = [
    { paths = "smart-contracts/domains/governance/{StreamGovernanceExecutor,StreamGovernanceBootstrap,StreamGovernanceEvidence,StreamGovernanceManifest,StreamGovernancePolicy,StreamGovernanceActionPolicy,StreamGovernanceScheduling,StreamStateExport,StreamRoleRegistry}.sol", via_ir = true },
    { paths = "smart-contracts/domains/modules/StreamModuleRegistry.sol", via_ir = true },
    { paths = "test/unit/governance/StreamGovernanceV2HolderRehearsal.t.sol", via_ir = true },
    { paths = "test/helpers/StreamGovernanceV2HolderRehearsalMocks.sol", via_ir = true },
    { paths = "script/current/**", via_ir = true },
    { paths = "test/current/**", via_ir = true },
    { paths = "test/unit/artist/StreamCollectionArtistRegistry.t.sol", via_ir = true },
    { paths = "test/unit/auctions/StreamEnglishAuctionHouse.t.sol", via_ir = true },
    { paths = "test/unit/entropy/StreamEntropyMetadata.t.sol", via_ir = true },
    { paths = "test/unit/entropy/StreamEntropyProviderVRF.t.sol", via_ir = true },
    { paths = "test/unit/mint/StreamFixedPriceSaleAdapter.t.sol", via_ir = true },
    { paths = "test/unit/governance/StreamGenesisInitializer.t.sol", via_ir = true },
    { paths = "test/unit/governance/StreamGovernanceActor.t.sol", via_ir = true },
    { paths = "test/unit/governance/StreamGovernanceCatalog.t.sol", via_ir = true },
    { paths = "test/unit/mint/StreamMintCanonicalRegistry.t.sol", via_ir = true },
    { paths = "test/unit/mint/StreamMintPointerCompatibility.t.sol", via_ir = true },
    { paths = "test/unit/revenue/StreamRoyaltyResolver.t.sol", via_ir = true },
    { paths = "test/unit/governance/StreamSystemManifest.t.sol", via_ir = true },
]
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "./deployments" },
]

[profile.current]
test = "test/current"
script = "script/current"
out = "out/current"
cache_path = "cache/current"
via_ir = true
build_info = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
