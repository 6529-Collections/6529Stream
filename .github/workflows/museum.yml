name: Museum tooling

on:
  pull_request:
    paths:
      - ".github/workflows/museum.yml"
      - "tools/museum/**"
      - "schemas/museum/**"
      - "docs/museum-*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/museum.yml"
      - "tools/museum/**"
      - "schemas/museum/**"
      - "docs/museum-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: museum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tooling:
    name: Offline museum tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"
      - name: Install pinned museum dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/museum/requirements-jsonld.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Test offline validation and export
        run: python -m unittest discover -s tools/museum -t . -p "test_*.py" -v
      - name: Check schema generation
        run: python -m tools.museum.schemas --check
      - name: Check fixture generation
        run: python -m tools.museum.fixtures --check
