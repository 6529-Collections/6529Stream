name: Museum tooling

on:
  pull_request:
    paths:
      - ".github/workflows/museum.yml"
      - "tools/museum/**"
      - "schemas/museum/**"
      - "docs/museum-*.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/museum.yml"
      - "tools/museum/**"
      - "schemas/museum/**"
      - "docs/museum-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: museum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tooling:
    name: Offline museum tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.13"
          # The setup-python manifest has no Windows binary for 3.12.13.
          - os: windows-latest
            python: "3.12.10"
    runs-on: ${{ matrix.os }}
    # The retained 202-case cohort takes about 24 minutes on the development host.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned museum dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/museum/requirements-jsonld.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Test offline validation and export
        run: python -m unittest discover -s tools/museum -t . -p "test_*.py" -v
      - name: Check schema generation
        run: python -m tools.museum.schemas --check
      - name: Check fixture generation
        run: python -m tools.museum.fixtures --check
      - name: Check semantic review schema generation
        run: python -m tools.museum.review --check
      - name: Check resource projection generation
        run: python -m tools.museum.projection --check
      - name: Check abstract and nonvisual projection generation
        run: python -m tools.museum.projection_v2 --check
      - name: Check PREMIS file correspondence generation
        run: python -m tools.museum.premis --check
      - name: Check IIIF Presentation 3 correspondence generation
        run: python -m tools.museum.iiif_model --check
      - name: Check LIDO correspondence generation
        run: python -m tools.museum.lido_model --check
