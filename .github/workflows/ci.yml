name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FOUNDRYUP_MAX_RETRIES: "10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  current-stack:
    name: Current stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: v1.7.1

      - name: Retry verified Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          if [ "$RUNNER_OS" = "Windows" ]; then
            foundryup="$foundryup.exe"
          fi
          test -x "$foundryup"
          # Retry the complete verifier, including its attestation download.
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Install pinned Python toolchain
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-tools.lock
          python -m pip check

      - name: Identify current compiler inputs
        id: current_compiler_inputs
        shell: bash
        run: |
          set -euo pipefail
          # The staged Git records bind paths, blob IDs, modes and submodule commits.
          inputs=$(git ls-files --stage -z -- foundry.toml .github/workflows/ci.yml .gitattributes .gitmodules foundry.lock remappings.txt smart-contracts test script lib | sha256sum | cut -d ' ' -f1)
          echo "digest=$inputs" >> "$GITHUB_OUTPUT"

      - name: Restore current compiler outputs
        id: current_compiler_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            out/current
            cache/current
          key: ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.19-current-v2-${{ hashFiles('foundry.toml') }}-${{ steps.current_compiler_inputs.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.19-current-v2-${{ hashFiles('foundry.toml') }}-

      - name: Build current compilation
        id: current_build
        shell: bash
        env:
          CACHE_MATCHED_KEY: ${{ steps.current_compiler_cache.outputs.cache-matched-key }}
          CACHE_EXACT_HIT: ${{ steps.current_compiler_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          FOUNDRY_PROFILE=current forge build 2>&1 | tee ci-logs/current-stack-build.log
          if ! python -m tools.deployment.generate_current_stack_artifacts --output-dir ci-logs/current-candidate 2>&1 | tee ci-logs/current-stack-export.log; then
            if [ -z "$CACHE_MATCHED_KEY" ] || [ "$CACHE_EXACT_HIT" = "true" ]; then
              exit 1
            fi
            # An incremental fallback may leave build-info from multiple compiler inputs.
            FOUNDRY_PROFILE=current forge build --force 2>&1 | tee -a ci-logs/current-stack-build.log
            python -m tools.deployment.generate_current_stack_artifacts --output-dir ci-logs/current-candidate 2>&1 | tee -a ci-logs/current-stack-export.log
          fi
          python -m tools.deployment.generate_current_stack_artifacts --output-dir ci-logs/current-candidate --check

      - name: Save current compiler outputs
        if: ${{ fromJSON(steps.current_compiler_cache.outputs.cache-hit || 'false') == false }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            out/current
            cache/current
          key: ${{ steps.current_compiler_cache.outputs.cache-primary-key }}

      - name: Validate and export the current compilation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          make current-stack-check 2>&1 | tee ci-logs/current-stack.log
          python -m tools.deployment.generate_current_stack_artifacts --output-dir ci-logs/current-candidate
          python -m tools.deployment.generate_current_stack_artifacts --output-dir ci-logs/current-candidate --check

      - name: Upload current compilation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-stack-compilation
          path: |
            ci-logs/current-stack.log
            ci-logs/current-stack-build.log
            ci-logs/current-stack-export.log
            ci-logs/current-candidate
          if-no-files-found: error
          retention-days: 14

  windows-wrapper:
    name: Windows PowerShell wrapper
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize Windows release-builder log
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          "Release-builder authority did not start." |
            Set-Content -Encoding utf8 ci-logs\release-build-tests-windows.log

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.10"

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: v1.7.1

      - name: Retry verified Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          if [ "$RUNNER_OS" = "Windows" ]; then
            foundryup="$foundryup.exe"
          fi
          test -x "$foundryup"
          # Retry the complete verifier, including its attestation download.
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Install pinned Solc toolchain
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-tools.lock
          python -m pip check
          solc-select install 0.8.19
          solc-select use 0.8.19

      - name: PowerShell syntax and wrapper runtime
        shell: powershell
        run: |
          $scriptPaths = @(
            "scripts\check.ps1",
            "scripts\bootstrap-windows.ps1",
            "scripts\windows-check-helpers.ps1",
            "scripts\test_windows_check_helpers.ps1"
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test_windows_check_helpers.ps1

      - name: Current local and Sepolia runner tests
        shell: pwsh
        run: |
          ./scripts/test_current_stack_local.ps1
          ./scripts/test_current_stack_sepolia.ps1
          ./scripts/test_current_stack_transaction_journal.ps1
          ./scripts/test_current_stack_launch_status.ps1
          ./scripts/test_current_stack_scenarios.ps1

      - name: Full release-builder test authority
        shell: powershell
        timeout-minutes: 20
        env:
          PYTHONIOENCODING: utf-8
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          cmd.exe /d /s /c "python -m tools.build.test_release_build_artifacts 2>&1" |
            Tee-Object -FilePath ci-logs\release-build-tests-windows.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            exit $testExit
          }

      - name: Upload Windows release-builder log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-build-tests-windows
          path: ci-logs/release-build-tests-windows.log
          if-no-files-found: error
          retention-days: 14

  stream-client:
    name: TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: packages/stream-client/package-lock.json

      - name: Test generated ABIs, signing payloads and snapshots
        shell: bash
        run: |
          npm --prefix packages/stream-client ci --ignore-scripts
          npm --prefix packages/stream-client test

