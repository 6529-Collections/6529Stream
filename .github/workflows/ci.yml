          if [ "$RUNNER_OS" = "Windows" ]; then
            foundryup="$foundryup.exe"
          fi
          test -x "$foundryup"
          # Retry the complete verifier, including its attestation download.
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Install pinned Slither toolchain
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-tools.lock
          python -m pip check
          solc-select install 0.8.19
          solc-select use 0.8.19

      - name: Check live Slither baseline
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          make slither-baseline-check 2>&1 | tee ci-logs/slither-baseline-check.log

  foundry:
    name: Foundry smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.13"

      - name: Changelog gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python3 -m tools.docs.test_changelog_check 2>&1 | tee ci-logs/changelog-tests.log

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref=""
          fi

          if [ -n "$base_ref" ]; then
            python3 -m tools.docs.check_changelog --base-ref "$base_ref" 2>&1 | tee ci-logs/changelog-check.log
          else
            python3 -m tools.docs.check_changelog 2>&1 | tee ci-logs/changelog-check.log
          fi

      - name: Install Foundry
        id: foundry_setup
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a
        with:
          version: v1.7.1

      - name: Retry verified Foundry installation
        if: ${{ steps.foundry_setup.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDRY_DIR="$HOME/.foundry"
          foundryup="$FOUNDRY_DIR/bin/foundryup"
          if [ "$RUNNER_OS" = "Windows" ]; then
            foundryup="$foundryup.exe"
          fi
          test -x "$foundryup"
          # Retry the complete verifier, including its attestation download.
          for attempt in 1 2 3; do
            sleep "$((attempt * 15))"
            if "$foundryup" --install 1.7.1; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          exit 1

      - name: Repository hygiene
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}...HEAD"
          else
            git diff --check "HEAD^...HEAD"
          fi

          for script in scripts/check.sh scripts/bootstrap-ec2.sh; do
            bash -n "$script"
          done

          python3 -m py_compile \
            tools/shared/argparse_helpers.py \
            tools/build/build_release_artifacts.py \
            tools/build/test_release_build_artifacts.py \
            tools/deployment/check_canonical_deployment_candidate.py \
