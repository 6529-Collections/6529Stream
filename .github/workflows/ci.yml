      - name: PowerShell syntax and wrapper runtime
        shell: pwsh
        run: |
          $scriptPaths = @(
            "scripts/check.ps1",
            "scripts/bootstrap-windows.ps1",
            "scripts/windows-check-helpers.ps1",
            "scripts/test_windows_check_helpers.ps1"
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
          }
          & ./scripts/test_windows_check_helpers.ps1

      - name: Identify default compiler inputs
        id: default_compiler_inputs
        shell: bash
        run: |
          set -euo pipefail
          # The staged Git records bind paths, blob IDs, modes and submodule commits.
          inputs=$(git ls-files --stage -z -- foundry.toml .github/workflows/ci.yml .gitattributes .gitmodules foundry.lock remappings.txt smart-contracts test script lib | sha256sum | cut -d ' ' -f1)
          echo "digest=$inputs" >> "$GITHUB_OUTPUT"

      - name: Restore default compiler outputs
        id: default_compiler_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            out
            cache
          key: ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.19-default-v2-${{ hashFiles('foundry.toml') }}-${{ steps.default_compiler_inputs.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-forge-1.7.1-solc-0.8.19-default-v2-${{ hashFiles('foundry.toml') }}-

